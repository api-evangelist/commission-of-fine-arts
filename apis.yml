description: >-
  The U.S. Commission of Fine Arts (CFA) is an independent federal agency
  established in 1910 that has review authority over the design and
  aesthetics of construction within Washington, D.C., and over coins,
  medals, and Federal commemorative works. The CFA also appoints the Old
  Georgetown Board which conducts design review for projects in the
  Georgetown Historic District. As of September 2026 the CFA publishes no
  public developer API, no OpenAPI specification and no developer program. Its
  roughly 19,500 project records are reachable only through a server-rendered
  Drupal Search API view at cfa.gov/records-research/project-search and through
  the records-and-research request process. The only machine-readable surfaces
  the agency serves are a sitemap.xml, a robots.txt and three RSS 2.0 feeds
  (blog, news, meetings). The CFA does publish a CISA-aligned Vulnerability
  Disclosure Policy with a security@cfa.gov contact and stated 3/7/90-day
  response targets.
